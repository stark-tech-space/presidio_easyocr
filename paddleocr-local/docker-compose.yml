services:
  paddleocr-local:
    image: paddleocr-local:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    # Use runtime for older Docker Compose compatibility
    runtime: nvidia
    # Also include deploy for newer Docker Compose
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    ipc: host
    shm_size: '8gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - PORT=8080
      - WORKERS=1
      - TIMEOUT=300
      - USE_GPU=true
      - USE_DOC_ORIENTATION=false
      - USE_DOC_UNWARPING=false
      - USE_TEXTLINE_ORIENTATION=false
      # NVIDIA Container Toolkit environment
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8080:8080"
    volumes:
      - paddleocr-models:/root/.paddleocr
      - paddlex-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  paddleocr-models:
  paddlex-models:
