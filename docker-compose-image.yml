services:
  presidio-image-redactor:
    image: presidio-image-redactor:latest
    build:
      context: ./presidio-image-redactor
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NVIDIA recommended settings for PyTorch containers
    ipc: host
    shm_size: '8gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    env_file:
      - ./presidio-image-redactor/.env
    ports:
      - "5003:${PORT:-3000}"